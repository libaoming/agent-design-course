    <text x="376" y="135">③ Vector DB</text>
    <text x="524" y="135">④ Retrieve Top-K</text>
    <text x="676" y="135">⑤ Inject + generate</text>
  </g>
  <g font-size="10" fill="#6b6b64" text-anchor="middle">
    <text x="80" y="154">By semantic boundary</text>
    <text x="228" y="154">Into vectors</text>
    <text x="376" y="154">Build index</text>
    <text x="524" y="154">Recall vs precision</text>
    <text x="676" y="154">Cite sources</text>
  </g>
  <text x="228" y="84" font-size="11" fill="#9a9a92" text-anchor="middle">Build index offline (one-time / periodic)</text>
  <text x="602" y="84" font-size="11" font-weight="700" fill="#C15F3C" text-anchor="middle">Query online (every request)</text>
  <text x="380" y="210" font-size="11" fill="#9a9a92" text-anchor="middle">Solves: knowledge cutoff / private-domain knowledge / fewer hallucinations (grounded answers)</text>
