    <path d="M140 138 L166 138 M166 138 L158 134 M166 138 L158 142" stroke="#C15F3C"/>
    <path d="M288 138 L314 138 M314 138 L306 134 M314 138 L306 142" stroke="#C15F3C"/>
    <path d="M436 138 L462 138 M462 138 L454 134 M462 138 L454 142" stroke="#C15F3C"/>
