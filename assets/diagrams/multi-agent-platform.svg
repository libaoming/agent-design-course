    <path d="M180 142 L211 142 M211 142 L203 137 M211 142 L203 147" stroke="#C15F3C"/>
    <path d="M365 142 L396 142 M396 142 L388 137 M396 142 L388 147" stroke="#C15F3C"/>
    <path d="M550 142 L581 142 M581 142 L573 137 M581 142 L573 147" stroke="#C15F3C"/>
  </g>
  <g font-size="13.5" font-weight="700" fill="#1a1a19" text-anchor="middle">
    <text x="103" y="138">A 多实例化</text>
    <text x="288" y="138">B 路由层</text>
    <text x="473" y="138">C 多租户隔离</text>
