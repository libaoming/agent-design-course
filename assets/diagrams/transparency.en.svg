<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system,'PingFang SC',sans-serif">
  <defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></defs>
  <rect x="0" y="0" width="720" height="300" rx="14" fill="#fbfaf8"/>
  <text x="28" y="36" font-size="18" font-weight="700" fill="#1a1a19">The three MECE layers of transparency</text>
  <text x="28" y="58" font-size="12.5" fill="#6b6b64">Sliced by &quot;who sees it + at what granularity&quot; — mutually exclusive, none replaceable</text>
  <g filter="url(#rough)" stroke="#2a2a28" stroke-width="1.6">
    <rect x="120" y="80" width="500" height="56" rx="8" fill="#ffffff"/>
    <rect x="120" y="148" width="500" height="56" rx="8" fill="#fdf6f1"/>
    <rect x="120" y="216" width="500" height="56" rx="8" fill="#ffffff"/>
    <path d="M104 80 C92 80 92 80 88 90 L88 262 C92 272 92 272 104 272" stroke="#C15F3C" stroke-width="1.6" fill="none"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1a1a19">
    <text x="140" y="113">L1 · UI transparency</text>
    <text x="140" y="181">L2 · Log transparency</text>
    <text x="140" y="249">L3 · Audit transparency</text>
  </g>
  <g font-size="11.5" fill="#6b6b64">
    <text x="350" y="105">end user · runtime</text>
    <text x="350" y="122">abstracted, filtered</text>
    <text x="350" y="173">PM / engineering · full</text>
    <text x="350" y="190">structured, replayable</text>
    <text x="350" y="241">compliance / regulator · after the fact</text>
    <text x="350" y="258">key snapshots, tamper-proof</text>
  </g>
  <text x="70" y="176" font-size="11.5" font-weight="700" fill="#C15F3C" transform="rotate(-90 70 176)">3 layers</text>
</svg>
