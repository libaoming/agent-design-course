  <text x="34" y="300" font-size="11.5" fill="#C15F3C" font-weight="700">合规场景翻转：</text>
  <text x="150" y="300" font-size="11.5" fill="#5b6370">产物会进下游决策时，宁可硬报错（B）也别友好说明（C）——B &gt; C</text>
