<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,'PingFang SC',sans-serif">
  <defs><filter id="rough" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="37" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter></defs>
  <rect x="0" y="0" width="680" height="360" rx="14" fill="#fbfaf8"/>
  <text x="28" y="36" font-size="18" font-weight="700" fill="#1a1a19">优先级：紧急 × 重要四象限</text>
  <text x="28" y="58" font-size="12.5" fill="#6b6b64">依赖是硬约束（先解阻塞）；同档内再用这张矩阵分</text>
  <g filter="url(#rough)" stroke="#2a2a28" stroke-width="1.6" fill="none">
    <rect x="170" y="92" width="220" height="110" rx="8" fill="#fdf6f1"/>
    <rect x="398" y="92" width="220" height="110" rx="8" fill="#ffffff"/>
    <rect x="170" y="210" width="220" height="110" rx="8" fill="#ffffff"/>
    <rect x="398" y="210" width="220" height="110" rx="8" fill="#ffffff"/>
    <path d="M150 326 L630 326 M630 326 L621 321 M630 326 L621 331" stroke="#9a9a92"/>
    <path d="M150 326 L150 80 M150 80 L145 89 M150 80 L155 89" stroke="#9a9a92"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1a1a19" text-anchor="middle">
    <text x="280" y="135">委托 / 快速处理</text>
    <text x="508" y="135">立刻做（active）</text>
    <text x="280" y="253">能砍就砍</text>
    <text x="508" y="253">排进计划、别遗忘</text>
  </g>
  <g font-size="11" fill="#6b6b64" text-anchor="middle">
    <text x="280" y="158">紧急但不重要：别占主线</text>
    <text x="508" y="158">紧急且重要：唯一该 active 的</text>
    <text x="280" y="276">不紧急不重要：占资源就删</text>
    <text x="508" y="276">不紧急但重要：易被拖成救火</text>
  </g>
  <text x="640" y="345" font-size="12" font-weight="700" fill="#C15F3C" text-anchor="end">重要度 →</text>
  <text x="138" y="78" font-size="12" font-weight="700" fill="#C15F3C" text-anchor="middle">紧急度 ↑</text>
</svg>
