<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="-apple-system,'PingFang SC',sans-serif">
  <defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="19" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></defs>
  <rect x="0" y="0" width="720" height="250" rx="14" fill="#fbfaf8"/>
  <text x="28" y="36" font-size="18" font-weight="700" fill="#1a1a19">Framework choice = matching complexity exactly to the need</text>
  <text x="28" y="58" font-size="12.5" fill="#6b6b64">Too much is liability, too little is hand-rolling — pick along the complexity spectrum, don&apos;t default to LangGraph</text>
  <g filter="url(#rough)" stroke="#2a2a28" stroke-width="1.6" fill="none">
    <path d="M50 150 L670 150 M670 150 L658 144 M670 150 L658 156" stroke="#C15F3C"/>
    <rect x="40" y="100" width="120" height="40" rx="8" fill="#ffffff"/>
    <rect x="200" y="100" width="120" height="40" rx="8" fill="#fdf6f1"/>
    <rect x="360" y="100" width="130" height="40" rx="8" fill="#ffffff"/>
    <rect x="530" y="100" width="130" height="40" rx="8" fill="#fdf6f1"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1a1a19" text-anchor="middle">
    <text x="100" y="125">Bare SDK</text>
    <text x="260" y="125">LangChain</text>
    <text x="425" y="125">LangGraph</text>
    <text x="595" y="125">AutoGen</text>
  </g>
  <g font-size="10.5" fill="#6b6b64" text-anchor="middle">
    <text x="100" y="178">simple single step</text>
    <text x="260" y="178">rapid prototyping</text>
    <text x="425" y="178">complex single task</text>
    <text x="595" y="178">multi-agent chat</text>
  </g>
  <text x="360" y="208" font-size="12" fill="#C15F3C" text-anchor="middle" font-weight="700">complexity / learning cost / lock-in cost  &#8594;</text>
  <text x="360" y="232" font-size="11" fill="#9a9a92" text-anchor="middle">Two questions: complex conditional flow within one task? dependencies between tasks?</text>
</svg>
