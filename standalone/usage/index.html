// tooltip helpers
const tip = $("#tip");
function showTip(html,x,y){ tip.innerHTML=html; tip.style.opacity=1;
  const w=tip.offsetWidth, h=tip.offsetHeight;
  let nx=x+16, ny=y-h-12; if(nx+w>innerWidth-8)nx=x-w-16; if(ny<8)ny=y+18;
  tip.style.left=nx+"px"; tip.style.top=ny+"px"; }
function hideTip(){ tip.style.opacity=0; }

// ---------- 图1：每日堆叠面积 ----------
function drawStacked(){
  const host=$("#chart1"); host.innerHTML="";
  const W=host.clientWidth||900, H=300, m={t:12,r:14,b:34,l:52};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"每日 Token 用量堆叠面积图"});
  const days=D.daily, n=days.length;
  const X=i=> m.l + (n<=1?iw/2 : i/(n-1)*iw);
  // 堆叠顺序（底→顶）：输出、输入、缓存创建
  const stacks=[["outp","--s2","输出"],["inp","--s1","输入"],["cc","--s3","缓存创建"]];
  let maxY=0; days.forEach(d=> maxY=Math.max(maxY,(d.outp||0)+(d.inp||0)+(d.cc||0)));
  maxY=maxY*1.06||1;
  const Y=v=> m.t + ih - v/maxY*ih;
  // grid + y ticks
  const ticks=4;
  for(let t=0;t<=ticks;t++){ const val=maxY*t/ticks, y=Y(val);
    svg.appendChild(el("line",{x1:m.l,y1:y,x2:m.l+iw,y2:y, class:t===0?"baseln":"gridln"}));
    const tx=el("text",{x:m.l-8,y:y+4, class:"axtxt tab","text-anchor":"end"}); tx.textContent=fmt(val); svg.appendChild(tx);
  }
  // x ticks（稀疏，约每 12 天）
  const step=Math.ceil(n/6);
  for(let i=0;i<n;i+=step){ const tx=el("text",{x:X(i),y:H-12, class:"axtxt","text-anchor":"middle"});
    tx.textContent=days[i].d.slice(5); svg.appendChild(tx); }
  // 累积基线绘制面积（自顶向下累加）
  let base=days.map(()=>0);
  stacks.forEach(([key,cvar])=>{
    const col=cssv(cvar);
    let dTop="", dBot="";
    days.forEach((d,i)=>{ const y0=Y(base[i]), y1=Y(base[i]+(d[key]||0));
      dTop+=(i===0?"M":"L")+X(i)+" "+y1+" "; });
    for(let i=n-1;i>=0;i--){ dBot+="L"+X(i)+" "+Y(base[i])+" "; }
    svg.appendChild(el("path",{d:dTop+dBot+"Z", fill:col, "fill-opacity":0.9, stroke:col, "stroke-width":0}));
    days.forEach((d,i)=> base[i]+=(d[key]||0));
  });
  // 2px 分隔线：顶部各层描边（surface gap 用 stroke=surface）
  const sc=cssv("--surface-1");
  let b2=days.map(()=>0);
  stacks.forEach(([key,cvar],si)=>{
    if(si<stacks.length){ let dl="";
      days.forEach((d,i)=>{ const y1=Y(b2[i]+(d[key]||0)); dl+=(i===0?"M":"L")+X(i)+" "+y1+" "; });
      svg.appendChild(el("path",{d:dl, fill:"none", stroke:sc, "stroke-width":2, "stroke-opacity":0.6})); }
    days.forEach((d,i)=> b2[i]+=(d[key]||0));
  });
  // crosshair + hover
  const cross=el("line",{x1:0,y1:m.t,x2:0,y2:m.t+ih, stroke:cssv("--muted"),"stroke-width":1,"stroke-dasharray":"3 3",opacity:0});
  svg.appendChild(cross);
  const dot=el("circle",{r:4, fill:cssv("--text-primary"), opacity:0}); svg.appendChild(dot);
  const hit=el("rect",{x:m.l,y:m.t,width:iw,height:ih, fill:"transparent"}); svg.appendChild(hit);
  hit.addEventListener("mousemove",ev=>{
    const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((sx-m.l)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const d=days[i], tx=X(i); cross.setAttribute("x1",tx); cross.setAttribute("x2",tx); cross.setAttribute("opacity",1);
    const tot=(d.outp||0)+(d.inp||0)+(d.cc||0);
    dot.setAttribute("cx",tx); dot.setAttribute("cy",Y(tot)); dot.setAttribute("opacity",1);
    showTip(`<div class="tt">${d.d}</div>`+
      `<div class="row"><span class="rk"><i class="sw" style="background:${cssv('--s2')}"></i>输出</span><span class="rv">${fmtFull(d.outp)}</span></div>`+
      `<div class="row"><span class="rk"><i class="sw" style="background:${cssv('--s1')}"></i>输入</span><span class="rv">${fmtFull(d.inp)}</span></div>`+
      `<div class="row"><span class="rk"><i class="sw" style="background:${cssv('--s3')}"></i>缓存创建</span><span class="rv">${fmtFull(d.cc)}</span></div>`+
      `<div class="row" style="border-top:1px solid var(--grid);padding-top:5px;margin-top:5px"><span class="rk">合计</span><span class="rv">${fmtFull(tot)}</span></div>`+
      `<div class="row"><span class="rk">会话 / 轮</span><span class="rv">${d.sess} / ${d.turns}</span></div>`,
      ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave",()=>{ hideTip(); cross.setAttribute("opacity",0); dot.setAttribute("opacity",0); });
  host.appendChild(svg);
}

// ---------- 图2：每日缓存读取 单系列面积 ----------
function drawCache(){
  const host=$("#chart2"); host.innerHTML="";
  const W=host.clientWidth||900, H=210, m={t:12,r:14,b:34,l:52};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"每日缓存读取面积图"});
  const days=D.daily, n=days.length;
  const X=i=> m.l+(n<=1?iw/2:i/(n-1)*iw);
  let maxY=0; days.forEach(d=>maxY=Math.max(maxY,d.cr||0)); maxY=maxY*1.08||1;
  const Y=v=> m.t+ih - v/maxY*ih;
  for(let t=0;t<=4;t++){ const val=maxY*t/4,y=Y(val);
    svg.appendChild(el("line",{x1:m.l,y1:y,x2:m.l+iw,y2:y,class:t===0?"baseln":"gridln"}));
    const tx=el("text",{x:m.l-8,y:y+4,class:"axtxt tab","text-anchor":"end"}); tx.textContent=fmt(val); svg.appendChild(tx); }
  const step=Math.ceil(n/6);
  for(let i=0;i<n;i+=step){ const tx=el("text",{x:X(i),y:H-12,class:"axtxt","text-anchor":"middle"}); tx.textContent=days[i].d.slice(5); svg.appendChild(tx); }
  const col=cssv("--seq"), soft=cssv("--seq-soft");
  let dTop="",dBot="";
  days.forEach((d,i)=> dTop+=(i===0?"M":"L")+X(i)+" "+Y(d.cr||0)+" ");
  for(let i=n-1;i>=0;i--) dBot+="L"+X(i)+" "+Y(0)+" ";
  svg.appendChild(el("path",{d:dTop+dBot+"Z", fill:soft, "fill-opacity":0.55}));
  svg.appendChild(el("path",{d:dTop, fill:"none", stroke:col, "stroke-width":2}));
  const cross=el("line",{y1:m.t,y2:m.t+ih, stroke:cssv("--muted"),"stroke-width":1,"stroke-dasharray":"3 3",opacity:0}); svg.appendChild(cross);
  const dot=el("circle",{r:4, fill:col, stroke:cssv("--surface-1"),"stroke-width":2, opacity:0}); svg.appendChild(dot);
  const hit=el("rect",{x:m.l,y:m.t,width:iw,height:ih,fill:"transparent"}); svg.appendChild(hit);
  hit.addEventListener("mousemove",ev=>{
    const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((sx-m.l)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const d=days[i], tx=X(i); cross.setAttribute("x1",tx); cross.setAttribute("x2",tx); cross.setAttribute("opacity",1);
    dot.setAttribute("cx",tx); dot.setAttribute("cy",Y(d.cr||0)); dot.setAttribute("opacity",1);
    showTip(`<div class="tt">${d.d}</div><div class="row"><span class="rk"><i class="sw" style="background:${col}"></i>缓存读取</span><span class="rv">${fmtFull(d.cr)}</span></div>`, ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave",()=>{ hideTip(); cross.setAttribute("opacity",0); dot.setAttribute("opacity",0); });
  host.appendChild(svg);
}

// ---------- 图3：按模型横向条形 ----------
function drawModels(){
  const host=$("#chart3"); host.innerHTML="";
  const ms=D.models, n=ms.length;
  const W=host.clientWidth||900, rowH=44, m={t:8,r:96,b:8,l:96};
  const H=m.t+m.b+n*rowH, iw=W-m.l-m.r;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img","aria-label":"按模型 Token 分布条形图"});
  const maxV=Math.max(...ms.map(x=>x.billable))||1;
  const col=cssv("--seq");
  ms.forEach((mm,i)=>{
    const y=m.t+i*rowH+rowH/2, bw=Math.max(2, mm.billable/maxV*iw);
    // 模型名（左，直接标签）
    const lab=el("text",{x:m.l-12,y:y+4,class:"barlabel","text-anchor":"end"}); lab.textContent=mm.label; svg.appendChild(lab);
    // 条（圆角数据端）
    const bar=el("rect",{x:m.l,y:y-9,width:bw,height:18,rx:4,ry:4,fill:col,"fill-opacity":0.92});
    svg.appendChild(bar);
    // 值（右，直接标签）
    const val=el("text",{x:m.l+bw+10,y:y+4,class:"barval","text-anchor":"start"}); val.textContent=fmt(mm.billable); svg.appendChild(val);
    // hover
    const hit=el("rect",{x:m.l,y:y-rowH/2,width:iw,height:rowH,fill:"transparent"}); svg.appendChild(hit);
    hit.addEventListener("mousemove",ev=>{ bar.setAttribute("fill-opacity",1);
      showTip(`<div class="tt">${mm.label}</div>`+
        `<div class="row"><span class="rk">计费口径合计</span><span class="rv">${fmtFull(mm.billable)}</span></div>`+
        `<div class="row"><span class="rk">输出</span><span class="rv">${fmtFull(mm.outp)}</span></div>`+
        `<div class="row"><span class="rk">输入</span><span class="rv">${fmtFull(mm.inp)}</span></div>`+
        `<div class="row"><span class="rk">缓存创建</span><span class="rv">${fmtFull(mm.cc)}</span></div>`+
        `<div class="row"><span class="rk">缓存读取</span><span class="rv">${fmtFull(mm.cr)}</span></div>`+
        `<div class="row"><span class="rk">会话</span><span class="rv">${mm.sess}</span></div>`, ev.clientX, ev.clientY); });
    hit.addEventListener("mouseleave",()=>{ bar.setAttribute("fill-opacity",0.92); hideTip(); });
  });
  host.appendChild(svg);
}

// ---------- 表格 ----------
function buildTables(){
  const dh=["日期","输出","输入","缓存创建","缓存读取","会话","轮"];
  let t1="<thead><tr>"+dh.map(h=>`<th>${h}</th>`).join("")+"</tr></thead><tbody>";
  D.daily.slice().reverse().forEach(d=>{ t1+=`<tr><td>${d.d}</td><td>${fmtFull(d.outp)}</td><td>${fmtFull(d.inp)}</td><td>${fmtFull(d.cc)}</td><td>${fmtFull(d.cr)}</td><td>${d.sess}</td><td>${d.turns}</td></tr>`; });
  $("#tblDaily").innerHTML=t1+"</tbody>";
  const mh=["模型","计费合计","输出","输入","缓存创建","缓存读取","会话"];
  let t2="<thead><tr>"+mh.map(h=>`<th>${h}</th>`).join("")+"</tr></thead><tbody>";
  D.models.forEach(m=>{ t2+=`<tr><td>${m.label}</td><td>${fmtFull(m.billable)}</td><td>${fmtFull(m.outp)}</td><td>${fmtFull(m.inp)}</td><td>${fmtFull(m.cc)}</td><td>${fmtFull(m.cr)}</td><td>${m.sess}</td></tr>`; });
  $("#tblModel").innerHTML=t2+"</tbody>";
}

function renderAll(){ drawStacked(); drawCache(); drawModels(); }
buildTables(); renderAll();
let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(renderAll,150); });
$("#tgl").addEventListener("click",()=>{
  const r=document.documentElement, cur=r.getAttribute("data-theme");
  const sysDark=matchMedia("(prefers-color-scheme:dark)").matches;
  const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
  r.setAttribute("data-theme",next); setTimeout(renderAll,30);
});
</script>
